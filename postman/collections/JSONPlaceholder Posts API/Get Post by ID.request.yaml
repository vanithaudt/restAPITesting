$kind: http-request
name: 'Get Post by ID'
method: GET
url: '{{base_url}}/posts/:id'
order: 1000
pathVariables:
  - key: id
    value: '1'
    description: The ID of the post to retrieve
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response has required fields", function () {
          const post = pm.response.json();
          pm.expect(post).to.have.property("id");
          pm.expect(post).to.have.property("title");
          pm.expect(post).to.have.property("body");
          pm.expect(post).to.have.property("userId");
      });

      pm.test("id matches requested path variable", function () {
          const post = pm.response.json();
          const requestedId = parseInt(pm.request.url.variables.get("id"));
          pm.expect(post.id).to.eql(requestedId);
      });

      pm.test("title and body are strings", function () {
          const post = pm.response.json();
          pm.expect(post.title).to.be.a("string");
          pm.expect(post.body).to.be.a("string");
      });
